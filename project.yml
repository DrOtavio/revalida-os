name: RevalidaOS
options:
  bundleIdPrefix: com.revalidaos
  deploymentTarget:
    iOS: '17.0'

settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    PRODUCT_BUNDLE_IDENTIFIER: com.revalidaos.app
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 2

targets:
  RevalidaOS:
    type: application
    platform: iOS

    sources:
      - path: RevalidaOS
        excludes:
          - Resources

      # XcodeGen trata recursos dentro de `sources` com buildPhase=resources.
      # O antigo bloco `resources:` não estava entrando no projeto gerado.
      - path: RevalidaOS/Resources
        buildPhase: resources

    settings:
      base:
        INFOPLIST_FILE: RevalidaOS/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ''

    scheme:
      testTargets: []
