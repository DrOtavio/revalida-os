name: Backfill official Revalida bank

on:
  workflow_dispatch:
    inputs:
      editions:
        description: 'Edições separadas por vírgula'
        required: true
        default: '2026/1,2025/2,2025/1'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r importer/requirements.txt

      - name: Import official exams (fail-closed)
        run: |
          python importer/backfill_official.py \
            --pack content/packs/latest.json \
            --editions '${{ inputs.editions }}' \
            --remove-demo

      - name: Validate pack
        run: python importer/validate_pack.py content/packs/latest.json

      - name: Build manifest
        run: |
          python importer/make_manifest.py \
            --pack content/packs/latest.json \
            --manifest content/manifest.json \
            --relative-pack packs/latest.json

      - name: Sync bundled seed for future IPA builds
        run: cp content/packs/latest.json RevalidaOS/Resources/seed_pack.json

      - name: Show reports
        if: always()
        run: |
          echo '--- staging ---'
          find importer/staging -maxdepth 1 -type f -name '*backfill-report.json' -print -exec cat {} \; 2>/dev/null || true

      - name: Upload backfill reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revalida-backfill-reports
          path: importer/staging/*backfill-report.json
          if-no-files-found: ignore

      - name: Commit official bank update
        run: |
          if ! git diff --quiet -- content RevalidaOS/Resources/seed_pack.json importer/staging; then
            git config user.name 'revalida-os-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add content RevalidaOS/Resources/seed_pack.json importer/staging
            git commit -m 'content: backfill banco oficial Revalida'
            git push
          else
            echo 'Nenhuma alteração para publicar.'
          fi
