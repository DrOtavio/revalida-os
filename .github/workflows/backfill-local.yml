name: Import local official Revalida PDFs

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edição (ex.: 2025/1)'
        required: true
        default: '2025/1'
      source_folder:
        description: 'Pasta dentro de sources/revalida (ex.: 2025-1)'
        required: true
        default: '2025-1'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install -r importer/requirements.txt
      - name: Verify source files
        run: |
          set -euo pipefail
          ls -lh "sources/revalida/${{ inputs.source_folder }}/"
          test -f "sources/revalida/${{ inputs.source_folder }}/exam.pdf"
          test -f "sources/revalida/${{ inputs.source_folder }}/key.pdf"
      - name: Import and validate official PDFs
        run: |
          set -euo pipefail
          python -u importer/backfill_local.py \
            --pack content/packs/latest.json \
            --edition "${{ inputs.edition }}" \
            --exam "sources/revalida/${{ inputs.source_folder }}/exam.pdf" \
            --key "sources/revalida/${{ inputs.source_folder }}/key.pdf" \
            --remove-demo
          python importer/validate_pack.py content/packs/latest.json
          python importer/make_manifest.py \
            --pack content/packs/latest.json \
            --manifest content/manifest.json \
            --relative-pack packs/latest.json
          cp content/packs/latest.json RevalidaOS/Resources/seed_pack.json
      - name: Upload import report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-import-report-${{ inputs.source_folder }}
          path: importer/staging/*-local-report.json
          if-no-files-found: ignore
      - name: Commit updated bank
        run: |
          set -euo pipefail
          if git diff --quiet -- content RevalidaOS/Resources/seed_pack.json importer/staging; then
            echo 'Nenhuma alteração para publicar.'
            exit 0
          fi
          git config user.name 'RevalidaOS Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add content RevalidaOS/Resources/seed_pack.json importer/staging
          git commit -m "Import official Revalida ${{ inputs.edition }}"
          git push
